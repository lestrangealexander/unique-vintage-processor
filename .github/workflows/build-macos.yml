name: macOS build (AU + VST3)

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'Tests/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64, macOS 11+)
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DUVP_BUILD_HARNESS=OFF 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target UniqueVintageProcessor_AU UniqueVintageProcessor_VST3 -j 4 2>&1 | tee build.log

      - name: Sign (ad hoc) and package
        run: |
          set -e
          ART="build/UniqueVintageProcessor_artefacts/Release"
          AU="$ART/AU/Unique Vintage Processor.component"
          VST3="$ART/VST3/Unique Vintage Processor.vst3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$VST3"
          lipo -info "$AU/Contents/MacOS/Unique Vintage Processor" | tee lipo.log
          mkdir -p "dist/Unique Vintage Processor"
          cp -R "$AU" "$VST3" "dist/Unique Vintage Processor/"
          cp README.md "dist/Unique Vintage Processor/READ ME.md"
          cd dist && ditto -c -k --sequesterRsrc --keepParent "Unique Vintage Processor" UniqueVintageProcessor-mac.zip

      - name: Validate the AU (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/UniqueVintageProcessor_artefacts/Release/AU/Unique Vintage Processor.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx UvPr SqAu 2>&1 | tee auval.log | tail -40

      - name: Publish the build to the 'builds' branch
        run: |
          set -e
          mkdir -p /tmp/out && cp dist/UniqueVintageProcessor-mac.zip lipo.log /tmp/out/ && cp auval.log /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/COMMIT
          cd /tmp/out
          git init -q && git checkout -q -b builds
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "macOS build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Unique Vintage Processor (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: dist/UniqueVintageProcessor-mac.zip
          body: |
            AU + VST3, universal (Apple Silicon and Intel), macOS 11 or later. Ad-hoc signed for personal use.
            Unzip, copy the .component to ~/Library/Audio/Plug-Ins/Components and the .vst3 to ~/Library/Audio/Plug-Ins/VST3,
            then clear the download quarantine (see READ ME.md inside the zip).

      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp *.log /tmp/logs/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/logs/COMMIT
          cd /tmp/logs
          git init -q && git checkout -q -b build-logs
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -q -m "build logs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-logs
