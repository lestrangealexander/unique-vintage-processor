# One-off: the first run of the combined workflow reused the old "build-2" tag and put the newest
# builds into that old release. Remove it; the same files are in the new versioned release.
name: Remove mislabeled build-2 release
on:
  push:
    paths: ['.github/workflows/cleanup-once.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete build-2 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
